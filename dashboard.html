<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=index.html">
<title>APEX Robotics Academy</title>
<script>
  // If Supabase redirects here with an error, send to login; otherwise home
  var params = new URLSearchParams(window.location.search);
  if (params.get('error')) {
    window.location.replace('login.html?error=' + encodeURIComponent(params.get('error_description') || params.get('error')));
  } else {
    window.location.replace('index.html');
  }
</script>
</head>
<body></body>
</html>
