<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – APEX Robotics Academy</title>
<meta name="description" content="Sign in to your APEX Robotics Academy student portal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* ── Auth Layout ─────────────────────────────────── */
.auth-wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(var(--nav-h) + 2rem) 1.25rem 3rem}
.auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.5rem;animation:scaleIn .3s ease both}
.auth-logo{display:flex;flex-direction:column;gap:3px;margin-bottom:2rem}
.auth-logo-name{font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--text)}
.auth-logo-tag{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--primary);text-transform:uppercase}
.auth-heading{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--text);margin-bottom:.35rem}
.auth-sub{font-size:13.5px;color:var(--muted);margin-bottom:2rem}

/* divider */
.auth-divider{display:flex;align-items:center;gap:.85rem;margin:1.5rem 0}
.auth-divider-line{flex:1;height:1px;background:var(--border)}
.auth-divider-text{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* social buttons */
.auth-social{display:flex;flex-direction:column;gap:.65rem;margin-bottom:0}
.btn-social{display:flex;align-items:center;justify-content:center;gap:.7rem;width:100%;padding:.72rem 1rem;border-radius:var(--r-ctrl);font-size:14px;font-weight:500;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);transition:background .18s,border-color .18s,transform .15s;cursor:pointer}
.btn-social:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);transform:translateY(-1px)}
.btn-social svg{flex-shrink:0}

/* form */
.auth-form{display:flex;flex-direction:column;gap:1.1rem}
.auth-form .form-input{background:rgba(255,255,255,.04)}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;right:.85rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);cursor:pointer;padding:.2rem;line-height:1;transition:color .15s;font-size:18px}
.pw-toggle:hover{color:var(--muted)}

/* forgot */
.auth-forgot{font-size:12.5px;color:var(--muted);text-align:right;margin-top:-.45rem;transition:color .15s}
.auth-forgot:hover{color:var(--primary)}

/* submit */
.auth-submit{margin-top:.35rem}

/* footer link */
.auth-footer-link{text-align:center;font-size:13.5px;color:var(--muted);margin-top:1.5rem}
.auth-footer-link a{color:var(--primary);font-weight:500;transition:opacity .15s}
.auth-footer-link a:hover{opacity:.8}

/* error */
.auth-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:var(--r-ctrl);padding:.75rem 1rem;font-size:13px;color:#f87171;display:none}
.auth-error.show{display:block;animation:fadeIn .2s ease}

/* top glow accent */
.auth-card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,rgba(16,185,129,.5),transparent);border-radius:1px}
.auth-card{position:relative;overflow:hidden}

@media(max-width:480px){
  .auth-card{padding:1.75rem 1.25rem;border-radius:16px}
  .auth-heading{font-size:20px}
}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<script src="webgl.js" defer></script>
<script src="nav.js" defer></script>

<div class="auth-wrap">
  <div class="auth-card">

    <!-- Logo -->
    <a href="index.html" class="auth-logo">
      <span class="auth-logo-name">APEX ROBOTICS ACADEMY</span>
      <span class="auth-logo-tag">Learn · Build · Innovate</span>
    </a>

    <!-- Heading -->
    <h1 class="auth-heading">Welcome back</h1>
    <p class="auth-sub">Sign in to access your student portal</p>

    <!-- Social login -->
    <div class="auth-social">
      <button class="btn-social" type="button" onclick="handleSocial('Google')">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908C16.658 14.153 17.64 11.891 17.64 9.2z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <div class="auth-divider">
      <span class="auth-divider-line"></span>
      <span class="auth-divider-text">or</span>
      <span class="auth-divider-line"></span>
    </div>

    <!-- Error message -->
    <div class="auth-error" id="auth-error"></div>

    <!-- Login form -->
    <form class="auth-form" id="login-form" novalidate>

      <div class="form-field" id="field-email">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        <span class="form-err">Please enter a valid email address.</span>
      </div>

      <div class="form-field" id="field-password">
        <label class="form-label" for="password">Password</label>
        <div class="pw-wrap">
          <input class="form-input" type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password visibility">&#128065;</button>
        </div>
        <span class="form-err">Password is required.</span>
      </div>

      <a href="#" class="auth-forgot">Forgot password?</a>

      <button type="submit" class="btn btn-primary btn-full btn-lg auth-submit" id="login-btn">
        Sign In
      </button>

    </form>

    <p class="auth-footer-link">
      Don't have an account? <a href="signup.html">Create one</a>
    </p>

  </div>
</div>

<script>
(function () {
  /* Password toggle */
  var toggle = document.getElementById('pw-toggle');
  var pwInput = document.getElementById('password');
  toggle.addEventListener('click', function () {
    var show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    toggle.innerHTML = show ? '&#128064;' : '&#128065;';
  });

  /* Form validation & submit */
  var form    = document.getElementById('login-form');
  var btn     = document.getElementById('login-btn');
  var errBox  = document.getElementById('auth-error');

  function showFieldError(fieldId, show) {
    var field = document.getElementById(fieldId);
    field && field.classList.toggle('has-error', show);
  }

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
  }

  function clearError() {
    errBox.classList.remove('show');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var valid = true;

    var emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    showFieldError('field-email', !emailOk);
    if (!emailOk) valid = false;

    showFieldError('field-password', !password);
    if (!password) valid = false;

    if (!valid) return;

    /* Loading state */
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    /* TODO: Replace with your real auth API call */
    setTimeout(function () {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      showError('Invalid email or password. Please try again.');
    }, 1400);
  });

  /* Social login placeholder */
  window.handleSocial = function (provider) {
    /* TODO: wire up OAuth provider */
    alert('Connect ' + provider + ' OAuth in your backend to enable this.');
  };
})();
</script>
</body>
</html>
